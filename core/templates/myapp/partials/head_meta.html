{% load static %}

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

<meta name="description"
      content="{{ page_description|default:'Aura Odontologia en Buenos Aires. Atención odontológica integral para niños, adolescentes y adultos con turnos rápidos por WhatsApp.' }}">

<meta name="keywords"
      content="{{ page_keywords|default:'odontología integral, odontopediatría, odontología general, implantología, rehabilitación oral, dentista buenos aires, salud bucal, consultorio odontológico' }}">

<meta name="author" content="Aura Odontologia">

<meta property="og:title"
      content="{{ og_title|default:'Aura Odontologia · Odontología integral para todas las edades' }}">

<meta property="og:description"
      content="{{ og_description|default:'Atención odontológica cercana, profesional y personalizada para toda la familia.' }}">

<meta property="og:image"
      content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}">

<meta property="og:url"
      content="{{ request.scheme }}://{{ request.get_host }}{{ request.path }}">

<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Aura Odontologia · Odontología integral para todas las edades">
<meta name="twitter:description" content="Atención odontológica profesional para toda la familia. Turnos rápidos por WhatsApp.">
<meta name="twitter:image"
      content="{{ request.scheme }}://{{ request.get_host }}{% static 'img/logo.png' %}">

<meta name="theme-color" content="#ffffff">
